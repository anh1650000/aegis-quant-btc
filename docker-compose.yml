services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TRADING_MODE: ${TRADING_MODE:-DRY_RUN}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "src.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      TRADING_MODE: ${TRADING_MODE:-DRY_RUN}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
